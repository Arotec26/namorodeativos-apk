<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>AROTEC • Namoro</title>

<style>
body{margin:0;background:#111;color:#eee;font-family:Arial,sans-serif}
header{position:sticky;top:0;background:#181818;padding:14px 12px;border-bottom:1px solid #333;z-index:2}
h1{font-size:19px;margin:0 0 4px}.sub{font-size:12px;color:#aaa}
button{background:#2b2b2b;color:#fff;border:1px solid #555;border-radius:8px;padding:9px 12px;font-weight:bold}
#refresh{margin-top:9px;width:100%}
#status{font-size:12px;color:#aaa;padding:8px 12px}
.card{margin:7px 9px;padding:12px;background:#1b1b1b;border:1px solid #333;border-radius:10px}
.row{display:flex;justify-content:space-between;gap:8px}
.ticker{font-size:18px;font-weight:bold}.price{font-size:17px}
.meta{font-size:11px;color:#aaa;margin-top:5px;line-height:1.45}
.signal{margin-top:9px;font-size:12px;font-weight:bold}
.details{display:none;margin-top:10px;padding-top:9px;border-top:1px solid #333;font-size:12px;line-height:1.6}
.open{display:block}.mini{margin-top:7px;width:100%}
.good{color:#8ee28e}.warn{color:#ffd36e}.alert{color:#ff8e8e}
</style>
</head>

<body>

<header>
<h1>AROTEC • ATIVOS EM NAMORO</h1>
<div class="sub">Protótipo móvel — contexto → reação → execução</div>
<button id="refresh" onclick="refreshAll()">ATUALIZAR PREÇOS</button>
</header>

<div id="status">Pronto para teste.</div>

<main id="list"></main>

<script>

const ativos=[
{ticker:"AURA33",regiao:"R$ 134–139",ultima:"R$ 142,90",minimo:"R$ 134,00",saida:"R$ 147,94",teto:"R$ 160,00"},
{ticker:"BBSE3",regiao:"—",ultima:"—",minimo:"R$ 42,00",saida:"—",teto:"—"},
{ticker:"S2GM34",regiao:"—",ultima:"R$ 17,50",minimo:"—",saida:"—",teto:"R$ 22,00"},
{ticker:"AVGO34",regiao:"—",ultima:"R$ 25,00",minimo:"—",saida:"R$ 25,75",teto:"—"},
{ticker:"BBDC4",regiao:"—",ultima:"R$ 16,80",minimo:"—",saida:"R$ 17,30",teto:"—"},
{ticker:"POMO4",regiao:"—",ultima:"R$ 5,25 / 4,83 / 4,81 / 4,50",minimo:"R$ 4,10",saida:"—",teto:"—"},
{ticker:"MDIA3",regiao:"—",ultima:"R$ 17,12",minimo:"—",saida:"R$ 17,63",teto:"—"}
];

function card(a,i){
 return `<section class="card">
 <div class="row">
  <div class="ticker">${a.ticker}</div>
  <div class="price" id="p${i}">—</div>
 </div>

 <div class="meta">
  Compra: ${a.regiao} · Última: ${a.ultima}
 </div>

 <div class="signal" id="s${i}">AGUARDANDO PREÇO</div>

 <button class="mini" onclick="toggle(${i})">DETALHES</button>

 <div class="details" id="d${i}">
  Região: ${a.regiao}<br>
  Últimas compras: ${a.ultima}<br>
  Mínimo visto: ${a.minimo}<br>
  Saída 3%: ${a.saida}<br>
  Teto observado: ${a.teto}<br><br>
  <b>AROtec:</b> semanal = contexto; 5m = execução.
 </div>

 </section>`;
}

function render(){
 list.innerHTML=ativos.map(card).join("");
}

function toggle(i){
 document.getElementById("d"+i).classList.toggle("open");
}


/* TESTE ATUAL:
   GitHub Pages → Cloudflare Worker
*/

async function testarWorker(){

 const workerURL =
 "https://winter-brook-e8ae.arotec26.workers.dev/";

 const r = await fetch(workerURL);
 const j = await r.json();

 return j;
}


async function refreshAll(){

 status.textContent="Testando conexão com AROTEC Proxy...";

 /* Nesta etapa testamos somente AURA33. */

 try{

   const resposta = await testarWorker();

   document.getElementById("p0").textContent="—";

   document.getElementById("s0").textContent=
     resposta.status === "ok"
     ? "WORKER CONECTADO"
     : "RESPOSTA INESPERADA";

   document.getElementById("s0").className=
     resposta.status === "ok"
     ? "signal good"
     : "signal alert";

   status.textContent=
     resposta.status === "ok"
     ? "GitHub Pages → Cloudflare Worker: conexão OK."
     : "Worker respondeu, mas a resposta não foi a esperada.";

 }catch(e){

   document.getElementById("p0").textContent="—";

   document.getElementById("s0").textContent=
     "WORKER INDISPONÍVEL";

   document.getElementById("s0").className=
     "signal alert";

   status.textContent=
     "Não foi possível conectar ao Cloudflare Worker.";
 }
}


render();

</script>

</body>
</html>
